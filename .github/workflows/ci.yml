name: CI/CD Pipeline

# `master` es la rama de trabajo real de este repositorio. El workflow anterior
# solo disparaba en main/develop, así que nunca llegó a ejecutarse una sola vez.
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  # Permite lanzar el pipeline a mano sobre cualquier rama, para validarlo antes
  # de fusionar. GitHub solo muestra este botón si el workflow con
  # `workflow_dispatch` existe ya en la rama por defecto del repositorio.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Primer paso deliberado: si el job nunca obtiene runner, GitHub lo deja
      # con `steps: []` y falla en ~2 s sin ningún log. Ese patrón (repo privado,
      # `runner_name` vacío) es un bloqueo de minutos de Actions de la cuenta, no
      # un fallo de código; este paso lo hace visible en cuanto haya runner.
      - name: Runner asignado (traza de ejecución)
        run: |
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }}"
          echo "python solicitado=${{ matrix.python-version }}"
          uname -a

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Tkinter necesita las bibliotecas de Tk y un servidor X. Sin esto la suite
      # no falla: se encoge en silencio, omitiendo las regresiones de interfaz.
      - name: Install GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb python3-tk

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          # setuptools viene preinstalado en el runner (79.0.1 en 3.11) con
          # vulnerabilidades conocidas. No es dependencia del proyecto, pero
          # `pip_audit --local` lo analiza, así que se fuerza una versión parcheada.
          python -m pip install --upgrade "setuptools>=84.1.0"
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Audit Python dependencies
        # setuptools no es dependencia del proyecto, pero el runner de 3.11 trae
        # 79.0.1 y `--local` lo audita: se actualiza antes (ver paso anterior).
        run: python -m pip_audit --local --skip-editable

      # Instalación real en un venv ajeno al checkout. El paso anterior usa
      # `-e .`, que resuelve imports desde el directorio actual y ocultó un
      # paquete movido que hacía fallar `pip install` para cualquier usuario.
      - name: Verify standalone installation
        run: PYTHON="$(command -v python)" bash scripts/verify-install.sh

      # Guarda contra el modo de fallo silencioso: si Tk o el display no
      # funcionan, este paso falla en vez de dejar que 13 tests se omitan.
      - name: Verify GUI tests will actually run
        run: xvfb-run -a python -c "import tkinter; tkinter.Tk().destroy(); print('Tk operativo')"

      # Sin --select: así ruff usa la configuración de pyproject.toml. El flag
      # anterior la sobrescribía y reportaba 242 errores de estilo deliberado.
      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type check with mypy
        run: python -m mypy tukul_core tukul_ui tukul.py

      # Una sola ejecución de la suite. El paso siguiente audita ESTE resultado:
      # correrla dos veces duplicaba el tiempo y, peor, permitía que la comprobación
      # de omisiones observara un resultado distinto del que dio el verde.
      # La cobertura se mide aquí y se exige un mínimo para que la señal verde
      # no pueda degradarse sin que se note.
      - name: Run test suite
        run: xvfb-run -a python -m pytest -q -rs --junitxml=informe-pruebas.xml --cov=tukul_core --cov=tukul_ui --cov-report=term-missing --cov-fail-under=70

      # Ningún test debe omitirse en CI: una omisión significa que el entorno no
      # puede ejercitar la interfaz y la señal verde sería falsa. Se lee el
      # atributo `skipped` del informe JUnit, que es un contrato estable, en vez
      # del resumen de texto de pytest, que es prosa para humanos.
      - name: Fail if any test was skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          raiz = ET.parse("informe-pruebas.xml").getroot()
          suites = [raiz] if raiz.tag == "testsuite" else raiz.findall("testsuite")
          omitidas = sum(int(s.get("skipped", 0)) for s in suites)
          total = sum(int(s.get("tests", 0)) for s in suites)
          print(f"{total} pruebas ejecutadas, {omitidas} omitidas")
          if omitidas:
              print("::error::Hay pruebas omitidas; la cobertura de interfaz no se está ejecutando.")
              sys.exit(1)
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: informe-pruebas-${{ matrix.python-version }}
          path: informe-pruebas.xml
          if-no-files-found: warn

      # Diagnóstico de la instalación. El paso anterior invocaba `--config`, que
      # exige un valor: fallaba siempre con exit 2.
      - name: Verify health check
        run: python tukul.py --health

      # `--health` debe diagnosticar el archivo que indica `--config`, no el de
      # por defecto. Se comprueba con un config de recuento conocido: el ejemplo
      # del repositorio declara dos perfiles utilizables.
      - name: Verify --config reaches the health check
        run: |
          python tukul.py --config tukul.example.toml --health | tee salud.txt
          grep -q "tukul.example.toml" salud.txt || {
            echo "::error::El diagnóstico no informa del archivo inspeccionado."; exit 1; }
          grep -q "2 perfil(es) habilitado(s)" salud.txt || {
            echo "::error::--config no se está honrando: health leyó otro archivo."; exit 1; }

      - name: Verify CLI contract
        run: |
          python tukul.py --help > /dev/null
          python tukul.py --opcion-que-no-existe 2>/dev/null && exit 1 || echo "argumento desconocido rechazado correctamente"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      # Informe completo (incluye falsos positivos de baja severidad): queda como
      # artefacto para revisión manual, nunca bloquea por sí solo.
      - name: Security check with bandit (full report)
        run: bandit -r tukul_core tukul_ui -f json -o bandit-report.json || true

      # Puerta real: solo severidad ALTA y confianza alta (-lll -ii). En severidad
      # MEDIA bandit solo reporta B310 (urlopen) en llm.py, un falso positivo ya
      # documentado ahí con #nosec: el esquema se valida explícitamente en
      # `validate_endpoint()` antes de llegar a esa línea. Sin este paso, ningún
      # hallazgo de bandit podía bloquear jamás el pipeline.
      - name: Security gate (fail on high severity findings)
        run: bandit -r tukul_core tukul_ui -lll -ii

      - name: Upload bandit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
