name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: python -m ruff check . --select=E,W,F

      - name: Type check with mypy
        run: python -m mypy articulador_core articulador_ui --ignore-missing-imports

      - name: Format check with black
        run: python -m black --check articulador_core articulador_ui

      - name: Import sort check with isort
        run: python -m isort --check-only articulador_core articulador_ui

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify health checks
        run: python articulador.py --config

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Security check with bandit
        run: bandit -r articulador_core articulador_ui -f json -o bandit-report.json || true
