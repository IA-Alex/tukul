name: Build standalone executables

# Compila un ejecutable independiente (sin Python instalado) para Windows y
# Linux. PyInstaller no compila entre sistemas operativos distintos: cada
# binario se construye en un runner del propio SO, no en uno solo. macOS no
# es un objetivo soportado: sin runner de Apple Silicon propio para probarlo
# y sin necesidad declarada, no se mantiene un target que nadie valida.
#
# Se dispara al publicar un tag "vX.Y.Z" (release real) o a mano para probar
# el empaquetado sin cortar una versión.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: articulador-linux-x86_64
          - os: windows-latest
            asset_name: articulador-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Solo Linux necesita las bibliotecas de sistema de Tk para compilar;
      # Windows trae Tk en el propio instalador de Python.
      - name: Install Tk system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-tk

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[keyring]"
          pip install pyinstaller

      - name: Build standalone executable
        run: pyinstaller --onefile --name articulador --noconfirm articulador.py

      # Humo mínimo: el binario debe arrancar y correr el diagnóstico sin
      # ventana. No prueba la GUI (no hay Xvfb en Windows), pero confirma que
      # el empaquetado no dejó nada roto en el arranque.
      - name: Smoke test (--health)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/articulador.exe --health
          else
            ./dist/articulador --health
          fi

      - name: Rename artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/articulador.exe "dist/${{ matrix.asset_name }}"
          else
            mv dist/articulador "dist/${{ matrix.asset_name }}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    # Solo al publicar un tag real: workflow_dispatch deja los binarios como
    # artefactos del run, sin crear un Release de GitHub por cada prueba.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # El GITHUB_TOKEN por defecto es de solo lectura en este repo; sin este
    # permiso explícito, crear el Release falla con 403 "Resource not
    # accessible by integration" (confirmado en el run que lo disparó).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release with the three binaries
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
