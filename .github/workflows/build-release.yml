name: Build standalone executables

# Compila un ejecutable independiente (sin Python instalado) para Linux x86_64.
#
# Windows y macOS no son objetivos soportados. macOS se retiró el 2026-08-17
# (`eaa14e0`) y Windows el 2026-11-12 (esta revisión): en ambos casos no hay
# necesidad declarada ni forma de validar el binario en el sistema destino, y no
# se mantiene un target que nadie prueba. El histórico está en `CHANGELOG.md`.
# Compilar un ejecutable para un SO que no se puede verificar es un pasivo: el
# caso vivo es el binario Linux, que llegó a publicarse roto (DF-C1).
#
# Se dispara al publicar un tag "vX.Y.Z" (release real) o a mano para probar
# el empaquetado sin cortar una versión.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin deliberado a una imagen CONCRETA, no `ubuntu-latest`. El sello
          # `-latest` es flotante: migró a una imagen con glibc más nueva y el
          # binario Linux pasó a exigir GLIBC_2.42, dejando de arrancar en
          # Debian 13 / Ubuntu 24.04 y anteriores (hallazgo DF-C1, auditoría de
          # cierre 2026-11-12). Compilar en la imagen más antigua aún soportada
          # fija el suelo de glibc que el binario puede exigir. No cambiar sin
          # verificar el requisito real en un host viejo.
          - os: ubuntu-22.04
            asset_name: tukul-linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Bibliotecas de sistema de Tk para compilar (Linux). No hay otros targets.
      - name: Install Tk system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-tk

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[keyring]"
          pip install pyinstaller

      - name: Build standalone executable
        run: pyinstaller --onefile --name tukul --noconfirm tukul.py

      # Humo mínimo: el binario debe arrancar y correr el diagnóstico sin
      # ventana. No prueba la GUI, pero confirma que el empaquetado no dejó nada
      # roto en el arranque.
      #
      # Además, esto se ejecuta sobre la imagen fijada (glibc 2.35): si el
      # binario exigiera una glibc más nueva que la del runner, aquí fallaría en
      # vez de publicarse roto. Es la verificación real del suelo de
      # compatibilidad (DF-C1).
      - name: Smoke test (--health)
        run: ./dist/tukul --health

      # Guard explícito del suelo de glibc (DF-C1). `readelf` sobre el binario
      # externo NO ve el requisito: las bibliotecas van comprimidas dentro del
      # archivo de PyInstaller. Hay que extraer la lib empaquetada (libtcl) y
      # leer SU requisito. Se falla si supera el de la imagen de build: esa es
      # la condición exacta que dejó el binario v0.4.1 inejecutable en distros
      # anteriores (exigía GLIBC_2.42 y la imagen tenía 2.42, pero Debian 13
      # trae 2.41). Sin este paso, un cambio de imagen reintroduce el defecto
      # mientras el smoke test sigue verde en el runner que lo compiló.
      - name: Verify Linux glibc floor
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile
          from PyInstaller.archive.readers import CArchiveReader

          del_runner = subprocess.run(
              ["ldd", "--version"], capture_output=True, text=True
          ).stdout.splitlines()[0].split()[-1]

          def glibc_max(ruta_o_datos):
              if isinstance(ruta_o_datos, (bytes, bytearray)):
                  with tempfile.NamedTemporaryFile(delete=False) as f:
                      f.write(ruta_o_datos); ruta = f.name
                  borrar = True
              else:
                  ruta, borrar = ruta_o_datos, False
              try:
                  out = subprocess.run(
                      ["readelf", "--version-info", ruta],
                      capture_output=True, text=True,
                  ).stdout
                  vers = sorted({t for t in out.replace(")", " ").split()
                                 if t.startswith("GLIBC_2.")})
                  return vers[-1] if vers else None
              finally:
                  if borrar:
                      os.unlink(ruta)

          archivo = CArchiveReader("dist/tukul")
          incumple = []
          for nombre in archivo.toc:
              if not nombre.endswith(".so"):
                  continue
              datos = archivo.extract(nombre)
              if not datos:
                  continue
              req = glibc_max(datos)
              if req is None:
                  continue
              # Comparamos "2.42" vs "2.35" por tuplas numéricas.
              par = lambda s: tuple(int(x) for x in s.split("_")[-1].split("."))
              if par(req) > par(del_runner):
                  incumple.append((nombre, req))

          print(f"glibc de la imagen de build: {del_runner}")
          if incumple:
              for nombre, req in incumple:
                  print(f"::error::{nombre} exige {req}, más nueva que la imagen "
                        f"({del_runner}); el binario no arrancará en distros "
                        f"anteriores (DF-C1).")
              sys.exit(1)
          print("✓ Ninguna biblioteca empaquetada exige una glibc más nueva "
                "que la de la imagen.")
          PY

      - name: Rename artifact
        run: mv dist/tukul "dist/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  # Ensayo de la firma: obtiene un certificado OIDC REAL y verifica el bundle,
  # pero NO publica Release (la copia firmada vive solo como artifact del run).
  # Existe porque el job `release` solo corre en tags y la firma keyless no se
  # puede validar sin un token de GitHub; así el contrato C1 se comprueba sin
  # cortar ninguna versión.
  firma-ensayo:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tukul-linux-x86_64
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Sign in rehearsal mode (keyless, no Release)
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/tukul-linux-x86_64.bundle dist/tukul-linux-x86_64
          ls -l dist/*.bundle

      - name: Verify against this workflow's OIDC identity
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/tukul-linux-x86_64.bundle \
            --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/build-release.yml@refs/heads/[^ ]+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/tukul-linux-x86_64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firma-ensayo
          path: dist/tukul-linux-x86_64.bundle
          if-no-files-found: error

  release:
    # Solo al publicar un tag real: workflow_dispatch deja los binarios como
    # artefactos del run, sin crear un Release de GitHub por cada prueba.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # El GITHUB_TOKEN por defecto es de solo lectura en este repo; sin este
    # permiso explícito, crear el Release falla con 403 "Resource not
    # accessible by integration" (confirmado en el run que lo disparó).
    permissions:
      contents: write
      # Firma keyless (contrato C1): cosign obtiene un certificado efímero del
      # servicio OIDC de GitHub y lo liga a este workflow, este repositorio y
      # esta ref. Sin `id-token: write` la firma no se puede emitir y el job
      # falla, que es justo el comportamiento deseado: nunca un release sin
      # firma. No concede ningún otro acceso.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # Integridad verificable del release: sin esto, el usuario descarga un
      # binario opaco y no puede comprobar que llegó íntegro. `SHA256SUMS` se
      # verifica con `sha256sum -c`; el SBOM (CycloneDX) permite inspeccionar el
      # contenido del binario empaquetado por PyInstaller.
      - name: Generate checksums and SBOM
        run: |
          cd dist
          sha256sum tukul-* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          pip install --quiet "cyclonedx-bom>=4.0"
          # El SBOM es best-effort: si la herramienta falla, el release sigue
          # siendo válido con los checksums, que son el contrato verificable.
          cyclonedx-py environment -o dist/sbom.cdx.json --output-format json || true
          if [ ! -s dist/sbom.cdx.json ]; then
            echo "::warning::No se pudo generar el SBOM; se publica solo SHA256SUMS."
            rm -f dist/sbom.cdx.json
          fi

      # Firma keyless del release (contrato C1, docs/contracts/contratos-0.6.md).
      #
      # `SHA256SUMS` viaja por el mismo canal HTTPS que el binario, así que
      # detecta corrupción pero no procedencia: quien controle el canal puede
      # sustituir ambos. La firma keyless de cosign no depende de una clave
      # privada custodiada: obtiene un certificado efímero del OIDC de GitHub
      # que liga la firma a este repositorio, este workflow y esta ref, y queda
      # registrada en el log de transparencia de Rekor.
      #
      # Deliberadamente SIN `|| true`: si la firma falla, el release no se
      # publica. Un binario sin firma verificado es peor que ninguno, porque el
      # usuario cree tener una verificación que no existe.
      #
      # Se ejecuta también en `workflow_dispatch`: ahí no se publica Release
      # (el job `release` solo corre en tags), así que es el smoke test del
      # contrato sin tocar ninguna versión publicada.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Sign release assets (keyless)
        # cosign 3.x firmó el bundle como única salida verificable: las flags
        # `--output-signature`/`--output-certificate` NO existen en esta versión
        # (comprobado con `sign-blob --help` sobre v3.1.4) y el binario no se
        # publica sin firma. El bundle contiene firma, certificado y la prueba
        # de Rekor, así que `cosign verify-blob --bundle` valida todo de una vez.
        run: |
          set -euo pipefail
          # `[!e]` excluye los `.bundle`: sin él, un segundo run reencontraba
          # `tukul-linux-x86_64.bundle` y firmaba el bundle (falló en v0.6.0,
          # run 43480365838). El binario termina en un digest (hex o '64').
          for archivo in dist/tukul-*[!e]; do
            cosign sign-blob --yes --bundle "${archivo}.bundle" "${archivo}"
          done
          ls -l dist/*.bundle

      # Verificación posterior a la firma, en el mismo job y con el certificado
      # YA emitido. Comprueba lo que va a verificar el usuario: la identidad del
      # workflow, el emisor OIDC de GitHub y que el artefacto firmado es el
      # mismo que se publica. Si esto no pasa, el Release no se crea.
      #
      # La identidad admite `workflow_dispatch` además de los tags: el disparo
      # manual es el smoke test de este contrato y no publica Release (el job
      # `release` solo corre en `refs/tags/v`). En un tag real, la ref del
      # certificado y la del Release son la misma.
      - name: Verify signatures against the release identity
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Mismo patrón que la firma: el bundle no se verifica a sí mismo.
          for archivo in dist/tukul-*[!e]; do
            cosign verify-blob \
              --bundle "${archivo}.bundle" \
              --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/build-release.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/[^ ]+)$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${archivo}"
          done
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
