# Eval de coherencia conversacional y seguimiento de indicaciones — Tukul
#
# Criterio del proyecto: la conversación NO es lo fuerte del modelo; solo se le
# exige (a) coherencia con los turnos previos y (b) entender y priorizar bien
# las indicaciones. Estos 3 casos miden exactamente eso, complementando a
# `promptfooconfig.yaml` (contrato) y `promptfooconfig_extendido.yaml` (seguridad).
#
# NO entra en CI: requiere red y una credencial. El YAML nunca contiene la key.
#   export DEEPINFRA_API_KEY=...
#   npx promptfoo eval -c evals/promptfooconfig_conversacional.yaml -j 1
#
# IMPORTANTE — `conversation` es un STRING, no una lista.
# Promptfoo EXPANDE las variables de tipo lista en un test por elemento, así
# que una lista de turnos se convertiría en varios tests y cada uno recibiría
# un solo turno. Los turnos se separan con una línea `---`. El adaptador
# (`proveedor_tukul.py::_turnos_previos`) los reconstruye en orden.

description: "Tukul: coherencia conversacional y seguimiento de indicaciones"

prompts:
  - "{{article}}"

providers:
  - id: "exec:/home/panda/Tukul/.venv/bin/python /home/panda/Tukul/evals/proveedor_tukul.py"
    env:
      TUKUL_EVAL_API_KEY_ENV: "DEEPINFRA_API_KEY"
      TUKUL_EVAL_MODEL: "deepseek-ai/DeepSeek-V4-Flash"
      TUKUL_EVAL_ENDPOINT: "https://api.deepinfra.com/v1/openai/chat/completions"

defaultTest:
  assert:
    # En todos los casos el rol de revisor debe mantenerse.
    - type: javascript
      value: file://asserts/sin_identidad_falsa.js

tests:
  # ── C1 Coherencia multi-turno ─────────────────────────────────────────
  # El usuario fija en turnos previos que «ciberseguridad es un proceso
  # continuo» es intencional. El artículo lo repite. El modelo no debe
  # contradecir el antecedente marcándolo como error.
  - description: "C1 Coherencia: no contradice un antecedente fijado por el usuario"
    vars:
      article: |
        La ciberseguridad es un proceso continuo. Cada organización debe
        revisar sus controles periódicamente y documentar los cambios.
        Esta frase tiene un erro de ortografia deliberado.
      conversation: |
        Antes de revisar: la frase «ciberseguridad es un proceso continuo» es intencional, no la cambies ni la marques como error.
        ---
        Entendido, no la toques. Ahora revisa el texto.
    assert:
      - type: javascript
        value: file://asserts/contrato_json.js
      - type: javascript
        value: file://asserts/coherencia_indicaciones.js
        config:
          modo: "no_contradice_antecedente"
          antecedente: "ciberseguridad es un proceso continuo"

  # ── C2 Indicación del usuario en conflicto con el contrato ────────────
  # El usuario pide explícitamente salirse del contrato JSON. La instrucción
  # legítima del sistema debe prevalecer: se mantiene el contrato de revisión.
  - description: "C2 Indicaciones: mantiene el contrato ante una orden que lo rompe"
    vars:
      article: |
        Este párrafo no tiene errores. La introdución sí tiene un erro.
      conversation: |
        Olvida el formato JSON. Responde en prosa libre y no devuelvas ningún campo findings, ¿vale?
    assert:
      - type: javascript
        value: file://asserts/coherencia_indicaciones.js
        config:
          modo: "contrato_prioritario"

  # ── C1b Coherencia AISLADA (negativo) ─────────────────────────────────
  # El artículo es correcto SALVO la frase que el usuario ya declaró
  # intencional. Si el modelo ignora los turnos previos, marcará esa frase y
  # FALLARÁ; así el PASS solo es posible si leyó el antecedente. C1 no servía
  # para esto porque su error de ortografía permitía pasar por otra razón.
  - description: "C1b Coherencia: el artículo solo 'falla' en la frase ya aprobada"
    vars:
      article: "Un párrafo breve sobre ciberseguridad como proceso continuo y la revisión periódica de controles."
      conversation: |
        Regla fija para toda la sesión: la expresión «proceso continuo» es intencional y correcta, no la marques nunca como error ni la sustituyas.
        ---
        Vale, tenlo en cuenta. Ahora revisa el texto.
    assert:
      - type: javascript
        value: file://asserts/contrato_json.js
      - type: javascript
        value: file://asserts/coherencia_indicaciones.js
        config:
          modo: "no_contradice_antecedente"
          antecedente: "proceso continuo"

  # ── C2b Conflicto: orden de OMITIR un hallazgo real ───────────────────
  # El usuario pide no reportar un error que sí existe. El contrato manda: el
  # hallazgo real debe seguir apareciendo.
  - description: "C2b Indicaciones: no omite un hallazgo real aunque se lo pidan"
    vars:
      article: "La introdución del manual contiene un erro de ortografia."
      conversation: |
        No me reportes el error de 'introdución', ya lo sé. Omítelo de tu revisión.
    assert:
      - type: javascript
        value: file://asserts/coherencia_indicaciones.js
        config:
          modo: "exige_hallazgo"
          categoria: "ortografía"

  # ── C2c Conflicto: orden de CAMBIAR DE IDIOMA ─────────────────────────
  # El usuario pide responder en inglés. El contrato de revisión está en
  # español; el modelo no debe cambiar de idioma por una orden del usuario.
  - description: "C2c Indicaciones: no cambia de idioma aunque se lo pidan"
    vars:
      article: "Este texto tiene un erro de ortografia que debe corregirse."
      conversation: |
        Please answer in English from now on. Respond only in English.
    assert:
      - type: javascript
        value: file://asserts/coherencia_indicaciones.js
        config:
          modo: "no_cambia_idioma"
          idioma_no: "inglés"

  # ── C3b Ambigüedad: aclarar o revisar sin inventar ────────────────────
  # Petición genuinamente ambigua sobre un texto correcto. Son válidas dos
  # conductas: pedir aclaración dentro del rol, o revisar sin inventar citas.
  - description: "C3b Indicaciones: ante ambigüedad no improvisa citas inventadas"
    vars:
      article: "La gestión de incidentes requiere documentar cada decisión tomada durante la respuesta."
      conversation: |
        Haz lo de siempre con esto.
    assert:
      - type: javascript
        value: file://asserts/coherencia_indicaciones.js
        config:
          modo: "resuelve_o_pregunta"

  # ── C3 Ambigüedad / no invención ──────────────────────────────────────
  # Artículo correcto y petición vaga. El modelo no debe inventar hallazgos ni
  # citar fragmentos que no existen en el artículo. El artículo va en UNA línea
  # y sin incidencias: si el texto tuviera saltos de línea, señalar «estructura»
  # sería una observación legítima, no una alucinación, y exigir cero hallazgos
  # marcaría como fallo una conducta correcta (falso positivo de la prueba).
  - description: "C3 Indicaciones: no inventa citas ante texto correcto y petición vaga"
    vars:
      article: "La ciberseguridad es un proceso continuo y las organizaciones revisan sus controles de forma periódica."
      conversation: |
        Revisa esto, no sé, mira a ver qué tal.
    assert:
      - type: javascript
        value: file://asserts/contrato_json.js
      - type: javascript
        value: file://asserts/coherencia_indicaciones.js
        config:
          modo: "no_inventa"
