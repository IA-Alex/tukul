<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" role="img" aria-label="Tukul — logotipo">
  <!--
    Logotipo «Obsidiana y Jade», con simetría especular respecto al eje vertical
    x=400 y composición centrada en el viewBox 800x600.

    Correcciones de simetría y proporción sobre la versión anterior:
    - Las dos «alas de libro» son espejos exactos (antes: libro blanco a la
      izquierda y ala jade con plumas a la derecha).
    - El lomo central es una hoja ancha y redondeada, no una punta afilada.
    - Los nodos de inspiración forman un arco simétrico izquierda/derecha.
    - El isotipo y el texto se centran en el lienzo con aire vertical uniforme.
    - Se retiran los glifos de fondo que quedaban pisados por las alas.

    Paleta (idéntica a `tukul_ui/estilo.py`):
      obsidiana #0D1117 · piedra #161C24 · estuco #2D3748
      texto #E2E8F0 · tenue #94A3B8 · jade #10B981 · ámbar #F59E0B
  -->
  <defs>
    <linearGradient id="jadeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Media ala de libro (lado derecho). El izquierdo es su espejo exacto. -->
    <g id="alaLibro">
      <path d="M0,66 Q48,50 106,22 L92,-14 Q42,22 0,40 Z" />
      <path d="M0,36 Q42,18 94,-16 L80,-44 Q34,-6 0,12 Z" />
    </g>
  </defs>

  <!-- Fondo obsidiana -->
  <rect width="100%" height="100%" fill="#0D1117" />

  <!-- Isotipo, centrado en el lienzo (x=400) -->
  <g transform="translate(400, 232)">

    <!-- Círculo de piedra nocturna -->
    <circle cx="0" cy="0" r="132" fill="#161C24" stroke="#2D3748" stroke-width="3" />

    <!-- Nodos de inspiración: arco simétrico izquierda/derecha -->
    <g stroke="url(#amberGrad)" stroke-width="2.5" fill="url(#amberGrad)">
      <line x1="-30" y1="-82" x2="0"   y2="-100" />
      <line x1="0"   y1="-100" x2="30" y2="-82" />
      <line x1="-30" y1="-82" x2="-16" y2="-48" />
      <line x1="30"  y1="-82" x2="16"  y2="-48" />
      <line x1="-16" y1="-48" x2="16"  y2="-48" />
      <circle cx="0"   cy="-100" r="6" />
      <circle cx="-30" cy="-82"  r="5" />
      <circle cx="30"  cy="-82"  r="5" />
      <circle cx="-16" cy="-48"  r="4" />
      <circle cx="16"  cy="-48"  r="4" />
    </g>

    <!-- Alas de libro: derecha (jade) e izquierda (espejo exacto) -->
    <g fill="url(#jadeGrad)" stroke="#0D1117" stroke-width="4" stroke-linejoin="round">
      <use href="#alaLibro" />
      <use href="#alaLibro" transform="scale(-1, 1)" />
    </g>

    <!-- Libro abierto central: dos páginas simétricas con lomo curvo -->
    <g stroke="#0D1117" stroke-width="4" stroke-linejoin="round">
      <!-- página izquierda -->
      <path d="M-3,44 Q-26,36 -50,24 Q-55,-6 -43,-26 Q-22,-15 -3,7 Z" fill="#E2E8F0" />
      <!-- página derecha (espejo) -->
      <path d="M3,44 Q26,36 50,24 Q55,-6 43,-26 Q22,-15 3,7 Z" fill="#E2E8F0" />
      <!-- canto/lomo central -->
      <path d="M-3,44 L-3,5 Q0,1 3,5 L3,44 Z" fill="#94A3B8" stroke="none" />
    </g>

    <!-- Base del tunkul: travesaño centrado y una lengüeta única -->
    <g fill="url(#amberGrad)">
      <rect x="-58" y="40" width="116" height="11" rx="5.5" />
      <path d="M-13,51 L-13,86 A13,13 0 0,0 13,86 L13,51 Z" />
    </g>
    <circle cx="0" cy="86" r="5" fill="#0D1117" />
  </g>

  <!-- Tipografía centrada -->
  <text x="400" y="470"
        font-family="'Montserrat','Inter','Helvetica Neue',sans-serif"
        font-size="76" font-weight="900" fill="#E2E8F0"
        text-anchor="middle" letter-spacing="0.12em">TUKUL</text>

  <text x="400" y="516"
        font-family="'Montserrat','Inter','Helvetica Neue',sans-serif"
        font-size="18" font-weight="700" fill="#94A3B8"
        text-anchor="middle" letter-spacing="0.25em">INSPIRADOR GENERATIVO</text>
</svg>
