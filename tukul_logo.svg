<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <!-- Degradado Verde Jade (Acción, Vida, Escritura Creativa) -->
        <linearGradient id="jadeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#064E3B" />
            <stop offset="50%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#34D399" />
        </linearGradient>
        
        <!-- Degradado Ámbar Tunkul (Inspiración, Sabiduría Maya) -->
        <linearGradient id="amberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#B45309" />
            <stop offset="50%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#FCD34D" />
        </linearGradient>

        <!-- Patrón Geométrico (Fondo) -->
        <path id="mayaGlyph" d="M0,0 h15 v-15 h15 v15 h15 v15 h-30 v15 h-15 z" fill="none" stroke="#2D3748" stroke-width="2" />
    </defs>

    <!-- Fondo Obsidiana Profunda -->
    <rect width="100%" height="100%" fill="#0D1117" />

    <!-- CONTENEDOR DEL ISOTIPO -->
    <g transform="translate(400, 240)">
        
        <!-- Círculo Base (Piedra Nocturna) -->
        <circle cx="0" cy="0" r="140" fill="#161C24" stroke="#2D3748" stroke-width="3" />
        
        <!-- Glifos Estilizados en el Fondo -->
        <g opacity="0.3">
            <use href="#mayaGlyph" x="-90" y="-80" />
            <use href="#mayaGlyph" x="50" y="-100" />
            <use href="#mayaGlyph" x="-100" y="40" />
            <use href="#mayaGlyph" x="60" y="60" />
        </g>

        <!-- Nodos de Inspiración (Conexiones Generativas / IA) -->
        <g stroke="url(#amberGrad)" stroke-width="2.5" fill="url(#amberGrad)">
            <circle cx="-15" cy="-95" r="5" />
            <circle cx="15" cy="-75" r="7" />
            <circle cx="-30" cy="-50" r="4" />
            <circle cx="35" cy="-40" r="4" />
            
            <line x1="-15" y1="-95" x2="15" y2="-75" />
            <line x1="15" y1="-75" x2="0" y2="-25" />
            <line x1="15" y1="-75" x2="35" y2="-40" />
            <line x1="15" y1="-75" x2="-30" y2="-50" />
        </g>

        <!-- Libro Izquierdo: Estructura, Lógica, El Artículo (Blanco Ceniza) -->
        <g fill="#E2E8F0" stroke="#0D1117" stroke-width="4" stroke-linejoin="round">
            <path d="M0,80 Q-50,60 -115,30 L-95,-10 Q-40,30 0,50 Z" />
            <path d="M0,80 Q-50,40 -110,5 L-90,-25 Q-40,15 0,35 Z" />
            
            <!-- Líneas de texto del editor -->
            <path d="M-85,10 L-35,35" stroke="#2D3748" stroke-width="4" stroke-linecap="round" />
            <path d="M-75,-5 L-25,20" stroke="#2D3748" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- Libro Derecho: Alas, Creatividad, Inspiración Orgánica (Verde Jade) -->
        <g fill="url(#jadeGrad)" stroke="#0D1117" stroke-width="4" stroke-linejoin="round">
            <path d="M0,80 Q50,60 115,30 L95,-10 Q40,30 0,50 Z" />
            
            <!-- Plumas dinámicas elevándose -->
            <path d="M0,50 Q40,20 105,-15 Q110,-25 95,-25 Q40,10 0,25 Z" />
            <path d="M0,25 Q40,-5 90,-45 Q100,-55 85,-50 Q30,0 0,5 Z" />
            <path d="M0,5 Q35,-30 70,-80 Q80,-90 65,-80 Q20,-25 0,-15 Z" />
        </g>

        <!-- Base Inferior: El Instrumento Tunkul que sostiene el conocimiento -->
        <path d="M-125,40 Q-50,75 -12,100 A18,18 0 0,0 12,100 Q50,75 125,40 L105,20 Q50,55 0,80 Q-50,55 -105,20 Z" fill="url(#amberGrad)" />
        
        <!-- Punto de anclaje central -->
        <circle cx="0" cy="75" r="9" fill="#0D1117" />
    </g>

    <!-- TIPOGRAFÍA Y TAGLINE -->
    <text x="400" y="480" font-family="&#39;Montserrat&#39;, &#39;Inter&#39;, &#39;Helvetica Neue&#39;, sans-serif" font-size="76" font-weight="900" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.12em">TUKUL</text>
    
    <text x="400" y="525" font-family="&#39;Montserrat&#39;, &#39;Inter&#39;, &#39;Helvetica Neue&#39;, sans-serif" font-size="18" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="0.25em">INSPIRADOR GENERATIVO</text>
</svg>