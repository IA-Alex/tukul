[project]
name = "tukul"
version = "0.5.0"
description = "Editor conversacional local para escribir y revisar artículos Markdown con un LLM remoto opcional"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Israel Alexis H", email = "lab@alexhernandez.tech"}
]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
]
dependencies = [
    "tomli-w>=1.0.0",  # For writing TOML files
]

[project.urls]
Repository = "https://github.com/IA-Alex/tukul"
Changelog = "https://github.com/IA-Alex/tukul/blob/master/CHANGELOG.md"

[project.optional-dependencies]
keyring = ["keyring>=24.0.0"]  # For secure credential storage
dev = [
    "pytest>=7.0.0",      # Test runner (la suite lo requiere; faltaba en los extras)
    "pytest-cov>=4.0.0",  # Cobertura: el pipeline la mide y la exige
    "pytest-timeout>=2.3.0",  # Un test colgado falla con su nombre, no cuelga el job
    "ruff>=0.1.0",        # Fast Python linter
    "mypy>=1.0.0",        # Type checker
    "pip-audit>=2.7.0",   # Auditoría de vulnerabilidades de dependencias
    "bandit>=1.7.0",      # Análisis estático de seguridad
    "locust>=2.0.0",      # Material de performance opcional (tests/performance/locustfile.py)
]

# Sin esto, `pip install -e .` instalaba el paquete pero no dejaba un comando
# `tukul`: había que seguir invocando `python tukul.py`.
[project.scripts]
tukul = "tukul:main"

[tool.ruff]
line-length = 100
target-version = "py311"

# Archivos a excluir
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    # `Articulos/` es contenido del usuario (artículos y plugins en Markdown y
    # scripts auxiliares), no código del proyecto. No debe pasar por el linter:
    # sus avisos bloqueaban la puerta de calidad por archivos ajenos al repo.
    "Articulos",
]

[tool.ruff.lint]
# Selectores de linting (habilitados)
select = [
    "E",      # Errores pycodestyle
    "W",      # Warnings pycodestyle
    "F",      # Pyflakes (undefined names, etc)
    "I",      # isort (imports)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C90",    # McCabe complexity
    "RUF",    # ruff-specific rules
]

ignore = [
    "E501",   # Line too long
    "E203",   # Whitespace before ':'
    # El proyecto usa deliberadamente un estilo denso de una línea en la capa de
    # UI (ver tukul_ui/app.py). Reformatearlo sepultaría el historial sin
    # ganar nada, así que la regla se desactiva en vez de dejar 108 avisos
    # permanentes que vuelven inútil la señal del linter.
    "E701",   # Multiple statements on one line (colon)
    "E702",   # Multiple statements on one line (semicolon)
]
# NOTE: W503 (line break before binary operator) was removed from modern ruff

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports OK en __init__
"tests/*" = ["F401", "F841"]  # Unused variables OK en tests
# El mapa de emoji de consola usa caracteres "ambiguos" a propósito. El patrón
# se ancla con `/**/` para que siga valiendo si el módulo cambia de sitio: la
# versión literal dependía de la ruta exacta y una reubicación lo reabría aunque
# la razón siguiera siendo válida.
"/**/tukul_core/logging_config.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["tukul_core", "tukul_ui"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# El core ya tiene anotaciones completas; la capa UI todavía no (60 defs sin
# anotar en app.py/dialogs.py/components). Exigir firmas tipadas en todo el
# proyecto hoy obligaría a un refactor masivo fuera del alcance de esta
# reparación, así que la regla se activa por módulo y se extenderá a `tukul_ui`
# cuando su extracción se complete.
[[tool.mypy.overrides]]
module = ["tukul_core.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Un test que se cuelga debe fallar con su nombre en el log. Sin esto, un job
# de CI quedó 15 minutos mudo sin indicar qué prueba se había atascado.
# El tope es por test: la suite entera tarda ~25 s como máximo.
timeout = 120
timeout_method = "signal"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# Sin esta declaración, el autodescubrimiento de setuptools aborta con
# "Multiple top-level packages discovered in a flat-layout" y `pip install -e .`
# falla. Las ejecuciones locales no lo notaban porque conftest.py pone la raíz
# en sys.path; solo se vio al reproducir el pipeline en un contenedor limpio.
#
# `find` en vez de una lista manual: la lista literal se quedó corta al añadir
# `tukul_core.real_time_feed`, y la rueda salía sin ese subpaquete (el comando
# instalado fallaba con ModuleNotFoundError). El autodescubrimiento no puede
# volver a desincronizarse de la estructura real.
[tool.setuptools.packages.find]
where = ["."]
include = ["tukul_core*", "tukul_ui*"]

[tool.setuptools]
py-modules = ["tukul"]
